<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong Game</title>

  <style>
    :root {
      --bg-dark: #111827;
      --panel: #1f2937;
      --line: #e5e7eb;
      --text: #f9fafb;
      --accent: #60a5fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #020817, #0f172a 45%, #111827);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 20px;
      width: 100%;
    }

    .scoreboard {
      width: 900px;
      max-width: 90vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      background: rgba(31, 41, 55, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 14px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .score-box {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .score-box .label {
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    #playerScore,
    #computerScore {
      min-width: 40px;
      text-align: center;
      font-size: 2rem;
      color: var(--accent);
    }

    canvas {
      display: block;
      width: 900px;
      max-width: 90vw;
      height: auto;
      aspect-ratio: 9 / 5;
      background: #0a0f1e;
      border: 3px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
    }

    .instructions {
      color: #cbd5e1;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="game-container">
    <div class="scoreboard">
      <div class="score-box">
        <span class="label">Player</span>
        <span id="playerScore">0</span>
      </div>

      <div class="score-box">
        <span class="label">Computer</span>
        <span id="computerScore">0</span>
      </div>
    </div>

    <canvas id="gameCanvas" width="900" height="500"
            aria-label="Pong game"></canvas>

    <div class="instructions">
      Control your paddle using the mouse or the ↑ and ↓ arrow keys.
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const playerScoreEl = document.getElementById("playerScore");
    const computerScoreEl = document.getElementById("computerScore");

    const paddleWidth = 14;
    const paddleHeight = 100;
    const ballSize = 12;
    const paddleSpeed = 8;
    const maxBallSpeed = 9;

    const leftPaddle = {
      x: 20,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 0,
      color: "#60a5fa"
    };

    const rightPaddle = {
      x: canvas.width - 20 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      color: "#f87171"
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: ballSize / 2,
      speedX: 5,
      speedY: 3,
      color: "#f8fafc"
    };

    let playerScore = 0;
    let computerScore = 0;

    const keys = {
      ArrowUp: false,
      ArrowDown: false
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;

      const angle = Math.random() * 1.2 - 0.6;
      const speed = 5 + Math.random() * 1.5;

      ball.speedX = direction * speed * Math.cos(angle);
      ball.speedY = speed * Math.sin(angle);

      if (Math.abs(ball.speedY) < 2) {
        ball.speedY = 2 * (Math.random() > 0.5 ? 1 : -1);
      }
    }

    function updateScore() {
      playerScoreEl.textContent = playerScore;
      computerScoreEl.textContent = computerScore;
    }

    function handleInput() {
      if (keys.ArrowUp) {
        leftPaddle.speed = -paddleSpeed;
      } else if (keys.ArrowDown) {
        leftPaddle.speed = paddleSpeed;
      } else {
        leftPaddle.speed = 0;
      }

      leftPaddle.y += leftPaddle.speed;
      leftPaddle.y = clamp(
        leftPaddle.y, 0, canvas.height - leftPaddle.height
      );
    }

    function updateComputerPaddle() {
      const targetY = ball.y - rightPaddle.height / 2;
      const difference = targetY - rightPaddle.y;

      if (Math.abs(difference) > 10) {
        rightPaddle.y += (difference > 0 ? 1 : -1) * 4.5;
      }

      rightPaddle.y = clamp(
        rightPaddle.y, 0, canvas.height - rightPaddle.height
      );
    }

    function checkWallCollision() {
      if (
        ball.y - ball.radius <= 0 ||
        ball.y + ball.radius >= canvas.height
      ) {
        ball.speedY *= -1;
        ball.y = clamp(
          ball.y, ball.radius, canvas.height - ball.radius
        );
      }
    }

    function checkPaddleCollision() {
      const leftHit =
        ball.speedX < 0 &&
        ball.x - ball.radius <= leftPaddle.x + leftPaddle.width &&
        ball.x + ball.radius >= leftPaddle.x &&
        ball.y + ball.radius >= leftPaddle.y &&
        ball.y - ball.radius <= leftPaddle.y + leftPaddle.height;

      const rightHit =
        ball.speedX > 0 &&
        ball.x + ball.radius >= rightPaddle.x &&
        ball.x - ball.radius <= rightPaddle.x + rightPaddle.width &&
        ball.y + ball.radius >= rightPaddle.y &&
        ball.y - ball.radius <= rightPaddle.y + rightPaddle.height;

      if (leftHit) {
        ball.x = leftPaddle.x + leftPaddle.width + ball.radius;

        const impact =
          (ball.y - (leftPaddle.y + leftPaddle.height / 2)) /
          (leftPaddle.height / 2);

        ball.speedX = Math.min(
          Math.abs(ball.speedX) + 0.45, maxBallSpeed
        );
        ball.speedY = impact * 5;
      }

      if (rightHit) {
        ball.x = rightPaddle.x - ball.radius;

        const impact =
          (ball.y - (rightPaddle.y + rightPaddle.height / 2)) /
          (rightPaddle.height / 2);

        ball.speedX = -Math.min(
          Math.abs(ball.speedX) + 0.45, maxBallSpeed
        );
        ball.speedY = impact * 5;
      }
    }

    function updateBall() {
      ball.x += ball.speedX;
      ball.y += ball.speedY;

      checkWallCollision();
      checkPaddleCollision();

      if (ball.x + ball.radius < 0) {
        computerScore++;
        updateScore();
        resetBall(1);
      }

      if (ball.x - ball.radius > canvas.width) {
        playerScore++;
        updateScore();
        resetBall(-1);
      }
    }

    function drawBackground() {
      ctx.fillStyle = "#0a0f1e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#e5e7eb";
      ctx.lineWidth = 3;
      ctx.setLineDash([18, 12]);

      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();

      ctx.setLineDash([]);
    }

    function drawPaddle(paddle) {
      ctx.fillStyle = paddle.color;
      ctx.fillRect(
        paddle.x, paddle.y, paddle.width, paddle.height
      );
    }

    function drawBall() {
      ctx.fillStyle = ball.color;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      drawBackground();
      drawPaddle(leftPaddle);
      drawPaddle(rightPaddle);
      drawBall();
    }

    function gameLoop() {
      handleInput();
      updateComputerPaddle();
      updateBall();
      draw();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("keydown", (event) => {
      if (event.key in keys) {
        keys[event.key] = true;
        event.preventDefault();
      }
    });

    window.addEventListener("keyup", (event) => {
      if (event.key in keys) {
        keys[event.key] = false;
        event.preventDefault();
      }
    });

    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      const scaleY = canvas.height / rect.height;
      const mouseY = (event.clientY - rect.top) * scaleY;

      leftPaddle.y = clamp(
        mouseY - leftPaddle.height / 2,
        0,
        canvas.height - leftPaddle.height
      );
    });

    updateScore();
    resetBall(1);
    gameLoop();
  </script>
</body>
</html>
